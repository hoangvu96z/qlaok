name: 🚀 Deploy Qlaok to VPS (qlaok.vunph.click)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: qlaok-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run typecheck && npm run typecheck --prefix mobile
      - run: npm run test:unit && npm run test:review && npm run test:sql && npm test --prefix mobile
      - run: npm run build

  migrate:
    needs: verify
    uses: ./.github/workflows/supabase-migrate.yml
    secrets: inherit

  deploy:
    needs: migrate
    name: Build & Deploy → qlaok.vunph.click
    runs-on: ubuntu-latest

    steps:
      - name: Prepare backend secret for SSH transfer
        env:
          BACKEND_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const key = (process.env.BACKEND_KEY || '').trim();
          if (!key || /\s/.test(key) || key.startsWith('sb_publishable_')) {
            throw new Error('Add a backend key to the SUPABASE_SERVICE_ROLE_KEY repository secret.');
          }
          const encoded = Buffer.from(key).toString('base64');
          console.log('::add-mask::' + encoded);
          fs.appendFileSync(process.env.GITHUB_ENV, 'QLAOK_SUPABASE_KEY_B64=' + encoded + '\n');
          NODE
      - name: 📥 Pull latest code & rebuild on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: QLAOK_SUPABASE_KEY_B64
          script: |
            set -e
            cd /var/www/qlaok.vunph.click
            if [ -d ".local-db" ]; then
              cp -r .local-db /tmp/qlaok_local_db_backup || true
            fi
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard ${{ github.sha }}
            node scripts/configure-backend-env.mjs
            export SUPABASE_SERVICE_ROLE_KEY="$(printf '%s' "$QLAOK_SUPABASE_KEY_B64" | base64 --decode)"
            if [ -d "/tmp/qlaok_local_db_backup" ]; then
              mkdir -p .local-db
              cp -r /tmp/qlaok_local_db_backup/* .local-db/ 2>/dev/null || true
            fi
            echo "📦 Installing dependencies..."
            npm ci --no-audit --no-fund
            echo "🔨 Building Next.js production app..."
            npm run build
            echo "🔄 Restarting PM2 process (qlaok)..."
            if pm2 describe qlaok > /dev/null 2>&1; then
              pm2 restart qlaok --update-env
            else
              pm2 start npm --name "qlaok" -- run start -- --port 3005
            fi
            pm2 save
            echo "Checking orders Realtime subscription..."
            node scripts/check-order-realtime.mjs
            echo "✅ Deploy Qlaok thành công!"
            pm2 show qlaok | grep -E "status|pid|uptime"
