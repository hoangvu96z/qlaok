name: 🚀 Deploy Qlaok to VPS (qlaok.vunph.click)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: qlaok-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run typecheck && npm run typecheck --prefix mobile
      - run: npm run test:unit && npm run test:review && npm run test:sql && npm run test:db-reset && npm test --prefix mobile
      - run: npm run build

  deploy:
    needs: verify
    if: needs.verify.result == 'success'
    name: Build & Deploy → qlaok.vunph.click
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Pull latest code & rebuild on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '43.128.116.69' }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -eu
            cd /var/www/qlaok.vunph.click
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard ${{ github.sha }}
            echo "🛡️ Installing and verifying the PostgreSQL backup timer..."
            sudo -n /usr/bin/node /var/www/qlaok.vunph.click/scripts/install-self-hosted-postgres-backup.mjs
            echo "🗃️ Applying pending self-hosted PostgreSQL migrations..."
            node scripts/migrate-self-hosted.mjs
            echo "📦 Installing dependencies..."
            npm ci --no-audit --no-fund
            echo "🔨 Building Next.js production app..."
            npm run build
            echo "🔄 Restarting PM2 process (qlaok)..."
            pm2 delete qlaok 2>/dev/null || true
            env -i HOME="$HOME" PATH="$PATH" PM2_HOME="${PM2_HOME:-$HOME/.pm2}" NODE_ENV=production pm2 start npm --name "qlaok" -- run start -- --port 3005
            pm2 save
            echo "Checking orders Realtime subscription..."
            node scripts/check-order-realtime.mjs
            echo "✅ Deploy Qlaok thành công!"
            pm2 show qlaok | grep -E "status|pid|uptime"
