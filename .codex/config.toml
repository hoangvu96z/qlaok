# Project-scoped GitHub MCP. Set GITHUB_PAT_TOKEN in the process environment;
# never put the token in this file or any other repository file.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60
default_tools_approval_mode = "writes"
