# Install as /etc/nginx/sites-available/qlaok.vunph.io.vn and enable with a
# symlink in sites-enabled. Obtain the hostname certificate with certbot using
# /var/www/letsencrypt as the webroot before enabling the HTTPS server block.

server {
    listen 80;
    server_name qlaok.vunph.io.vn;

    client_max_body_size 6m;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name qlaok.vunph.io.vn;

    ssl_certificate /etc/letsencrypt/live/qlaok.vunph.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qlaok.vunph.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 6m;
    server_tokens off;

    location = /rest/v1 {
        return 308 /rest/v1/;
    }

    location ^~ /rest/v1/ {
        proxy_pass http://127.0.0.1:3106/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /media/ {
        proxy_pass http://127.0.0.1:3911/;
        proxy_http_version 1.1;
        proxy_set_header Host qlaok-staging-media.web.qlaok.vunph.io.vn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /api/orders/events {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
